<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Area Fajar - Cek Keepstock</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
  <style>
    :root { --bg-dark: #12161f; --card-dark: #1b222d; --border-color: #2a3447; --accent-cyan: #00f0ff; --accent-orange: #ff9900; --primary: #F4B400; }
    body { background-color: var(--bg-dark); color: #e2e8f0; font-family: 'Segoe UI', sans-serif; max-width: 480px; margin: 0 auto; overflow-x: hidden; }
    #sidebar { position: fixed; top: 0; left: -260px; width: 260px; height: 100%; background: #0f141d; border-right: 2px solid var(--border-color); z-index: 1050; transition: left 0.3s ease; display: flex; flex-direction: column; }
    #sidebar.active { left: 0; }
    .sidebar-header { padding: 15px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
    .sidebar-menu { padding: 15px 10px; flex-grow: 1; overflow-y: auto; }
    .sidebar-item { padding: 10px 12px; color: #e2e8f0; border-radius: 8px; display: flex; align-items: center; gap: 12px; text-decoration: none; font-weight: 600; font-size: 13px; margin-bottom: 6px; }
    .sidebar-item:hover, .sidebar-item.active { background: rgba(0, 240, 255, 0.1); color: var(--accent-cyan); }
    #sidebarOverlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.6); z-index: 1040; display: none; }
    #sidebarOverlay.active { display: block; }
    .navbar { background: linear-gradient(135deg, #0f141d, #1a2230) !important; border-bottom: 2px solid var(--border-color); }
    .card { background-color: var(--card-dark); border: 1px solid var(--border-color); border-radius: 0.75rem; }
    .form-control, select { background-color: #12161f; border-color: var(--border-color); color: #fff; font-size: 13px; }
    .radio-group { display: flex; background: #12161f; padding: 4px; border-radius: 8px; margin-bottom: 12px; border: 1px solid var(--border-color); }
    .radio-group input[type="radio"] { display: none; }
    .radio-group label { flex: 1; text-align: center; padding: 6px; cursor: pointer; border-radius: 6px; font-size: 11px; color: #aaa; font-weight: bold; }
    input[type="radio"]:checked + label { background: var(--primary); color: #000; }
    .item-card { background: var(--card-dark); padding: 10px; border-radius: 10px; border-top: 4px solid var(--primary); border: 1px solid var(--border-color); margin-bottom: 8px; }
    .qty-badge { background: rgba(34, 197, 94, 0.2); color: #4ade80; padding: 4px; border-radius: 4px; font-size: 11px; font-weight: bold; text-align: center; margin-top: 6px; }
    .barcode-svg { max-width: 100%; height: 35px; }
  </style>
</head>
<body>

  <div id="sidebarOverlay" onclick="toggleSidebar()"></div>
  <div id="sidebar">
    <div class="sidebar-header">
      <span class="fw-bold text-uppercase fs-6 text-info"><i class="fa-solid fa-bars me-2"></i>Pilih Menu</span>
      <button class="btn btn-sm btn-close btn-close-white" onclick="toggleSidebar()"></button>
    </div>
    <div class="sidebar-menu">
      <a href="index.html" class="sidebar-item" onclick="toggleSidebar()">
        <i class="fa-solid fa-microchip fs-5" style="color: var(--accent-cyan);"></i>
        <div><div>Scanner Tools</div><div class="text-muted" style="font-size: 10px;">Update Alamat & Collecting</div></div>
      </a>
      <a href="expired.html" class="sidebar-item" onclick="toggleSidebar()">
        <i class="fa-solid fa-calendar-days fs-5" style="color: var(--accent-orange);"></i>
        <div><div>Update Expired</div><div class="text-muted" style="font-size: 10px;">Fast Scan & Entry Expired</div></div>
      </a>
      <a href="keepstock.html" class="sidebar-item active" onclick="toggleSidebar()">
        <i class="fa-solid fa-boxes-stacked fs-5 text-success"></i>
        <div><div>Cek Keepstock</div><div class="text-muted" style="font-size: 10px;">Monitoring Stock Toko</div></div>
      </a>
    </div>
    <div class="p-3 border-top border-secondary text-muted font-monospace" style="font-size: 10px; text-align: center;">Area Fajar V2.6</div>
  </div>

  <nav class="navbar navbar-dark mb-3 py-2 px-3">
    <div class="container-fluid px-0 d-flex justify-content-between align-items-center">
      <div class="d-flex align-items-center gap-2">
        <button class="btn btn-outline-light btn-sm py-1 px-2 border-secondary" onclick="toggleSidebar()"><i class="fa-solid fa-bars"></i></button>
        <span class="navbar-brand fw-bold fs-6 text-uppercase mb-0">Cek Keepstock</span>
      </div>
      <span class="badge bg-secondary border border-secondary text-light font-monospace" style="font-size: 10px;">AREA FAJAR</span>
    </div>
  </nav>

  <div class="container px-3 pb-4">
    <div class="card mb-3 p-3">
      <select id="storeSelect" class="form-select mb-2" onchange="changeStore(this.value)">
        <option value="" disabled selected>⏳ Memuat daftar toko...</option>
      </select>

      <div class="radio-group">
        <input type="radio" id="sku" name="method" value="sku" checked><label for="sku">SKU</label>
        <input type="radio" id="alamat" name="method" value="alamat"><label for="alamat">ALAMAT</label>
        <input type="radio" id="box" name="method" value="box"><label for="box">BOX</label>
      </div>

      <div class="input-group input-group-sm mb-2">
        <input type="text" id="searchValue" class="form-control" placeholder="Cari..." onkeypress="if(event.key==='Enter') startSearch()">
        <button class="btn btn-warning fw-bold px-3" onclick="startSearch()">CARI</button>
      </div>
    </div>

    <div id="summaryReportArea"></div>
    <div id="resultArea"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const KEEPSTOCK_GAS_API_URL = "https://script.google.com/macros/s/AKfycbz4vYZpoKd5_dt-aAMUtbvWGLEsEbKd8hzOmh6fwmrx6TBaOAUybZPaHTn6H34nIewDuQ/exec";

    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('active');
      document.getElementById('sidebarOverlay').classList.toggle('active');
    }

    window.onload = function() {
      loadStores();
    };

    function loadStores() {
      fetch(`${KEEPSTOCK_GAS_API_URL}?action=getStoreList`).then(res => res.json()).then(res => {
        const select = document.getElementById("storeSelect");
        select.innerHTML = '<option value="" disabled selected>-- Pilih Toko --</option>';
        (res.data || []).forEach(store => {
          let opt = document.createElement("option"); opt.value = store; opt.textContent = store; select.appendChild(opt);
        });
      });
    }

    function changeStore(storeName) {
      if (!storeName) return;
      fetch(KEEPSTOCK_GAS_API_URL, { method: "POST", body: JSON.stringify({ action: "updateSelectedStore", toko: storeName }) });
    }

    function startSearch() {
      const store = document.getElementById("storeSelect").value;
      const method = document.querySelector("input[name='method']:checked").value;
      const val = document.getElementById("searchValue").value.trim();
      if (!store || !val) { alert("Pilih toko dan isi kata kunci!"); return; }

      document.getElementById("resultArea").innerHTML = "<p class='text-center text-muted'>Mencari...</p>";
      fetch(`${KEEPSTOCK_GAS_API_URL}?action=searchStock&toko=${encodeURIComponent(store)}&method=${method}&value=${encodeURIComponent(val)}`)
        .then(res => res.json()).then(res => renderResults(res));
    }

    function renderResults(data) {
      const resultArea = document.getElementById("resultArea");
      if (!data.items || data.items.length === 0) {
        resultArea.innerHTML = "<p class='text-center text-muted'>Tidak ada hasil cocok.</p>";
        return;
      }
      resultArea.innerHTML = data.items.map((item, index) => `
        <div class="item-card">
          <div class="fw-bold text-light" style="font-size: 12px;">${item.namaBarang}</div>
          <div class="text-muted" style="font-size: 11px;">SKU: <strong class="text-info">${item.sku}</strong> | BOX: <strong>${item.box}</strong></div>
          <div class="text-muted" style="font-size: 11px;">ALAMAT: <span class="text-danger fw-bold">${item.alamat}</span></div>
          <div class="text-center my-1"><svg class="barcode-svg" id="barcode-${index}"></svg></div>
          <div class="qty-badge">QTY KEEP STOCK: ${item.stock}</div>
        </div>
      `).join('');

      data.items.forEach((item, index) => {
        if (item.sku) {
          try { JsBarcode(`#barcode-${index}`, String(item.sku).trim(), { format: "CODE128", width: 2, height: 30, displayValue: false }); } catch(e) {}
        }
      });
    }
  </script>
</body>
</html>
