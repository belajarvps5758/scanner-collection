<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jadwal Harian & Matrix Roster</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root[data-theme="dark"] {
      --bg-body: #090d16;
      --bg-card: rgba(17, 24, 39, 0.88);
      --bg-modal: #0f172a;
      --bg-input: #0b1220;
      --border-color: rgba(56, 189, 248, 0.24);
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.25);
    }
    :root[data-theme="light"] {
      --bg-body: #f1f5f9;
      --bg-card: #ffffff;
      --bg-modal: #ffffff;
      --bg-input: #f8fafc;
      --border-color: #cbd5e1;
      --text-main: #0f172a;
      --text-muted: #475569;
      --accent: #0284c7;
      --accent-glow: rgba(2, 132, 199, 0.15);
    }

    body {
      background-color: var(--bg-body);
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    .glass-panel {
      background: var(--bg-card);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-color);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.25);
    }

    .modal-panel {
      background: var(--bg-modal);
      border: 1px solid var(--border-color);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.55);
    }

    .cyber-input {
      background-color: var(--bg-input);
      border: 1px solid var(--border-color);
      color: var(--text-main);
    }
    .cyber-input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .mono { font-family: 'JetBrains Mono', monospace; }

    .shift-do { background: rgba(239, 68, 68, 0.14); border-color: rgba(239, 68, 68, 0.45); color: #f87171; }
    .shift-al { background: rgba(245, 158, 11, 0.15); border-color: rgba(245, 158, 11, 0.45); color: #fbbf24; }
    .shift-st09 { background: rgba(16, 185, 129, 0.14); border-color: rgba(16, 185, 129, 0.45); color: #34d399; }
    .shift-st14 { background: rgba(56, 189, 248, 0.14); border-color: rgba(56, 189, 248, 0.45); color: #38bdf8; }
    .shift-sp { background: rgba(168, 85, 247, 0.14); border-color: rgba(168, 85, 247, 0.45); color: #c084fc; }
    .shift-default { background: rgba(148, 163, 184, 0.12); border-color: rgba(148, 163, 184, 0.35); color: var(--text-main); }

    [data-theme="light"] .shift-do { color: #dc2626; }
    [data-theme="light"] .shift-al { color: #d97706; }
    [data-theme="light"] .shift-st09 { color: #059669; }
    [data-theme="light"] .shift-st14 { color: #0284c7; }
    [data-theme="light"] .shift-sp { color: #7e22ce; }
  </style>
</head>
<body class="min-h-screen p-4 md:p-8">
  <div class="max-w-4xl mx-auto space-y-6">

    <!-- Header & Theme Switcher -->
    <div class="flex items-center justify-between">
      <div>
        <h1 class="text-xl md:text-2xl font-bold tracking-tight flex items-center gap-2.5">
          <span class="inline-block w-2.5 h-2.5 rounded-full bg-sky-400 animate-pulse"></span>
          ROSTER SCHEDULE MATRIX
        </h1>
        <p id="periodeSubtitle" class="text-xs md:text-sm font-medium mt-0.5 flex items-center gap-1.5" style="color: var(--text-muted);">
          <i data-lucide="calendar-range" class="w-4 h-4 text-sky-400"></i>
          <span>Periode : -</span>
        </p>
      </div>
      <button onclick="toggleTheme()" id="themeBtn"
        class="px-3 py-1.5 rounded-lg text-xs font-semibold border transition cursor-pointer flex items-center gap-1.5"
        style="border-color: var(--border-color); background: var(--bg-card);">
        <i data-lucide="sun" class="w-3.5 h-3.5 text-amber-400"></i>
        <span>Light Mode</span>
      </button>
    </div>

    <!-- Form Pencarian -->
    <form id="searchForm" onsubmit="handleSearch(event)" class="glass-panel rounded-2xl p-5">
      <div class="grid grid-cols-1 md:grid-cols-4 gap-4 items-end">
        <div>
          <label class="flex items-center gap-1.5 text-xs font-semibold uppercase tracking-wider mb-1.5" style="color: var(--text-muted);">
            <i data-lucide="id-card" class="w-3.5 h-3.5 text-sky-400"></i>
            <span>NIK Karyawan</span>
          </label>
          <input type="text" id="nikInput" placeholder="Contoh: 32210010" required autocomplete="off"
            class="cyber-input w-full rounded-xl px-3.5 py-2.5 text-sm mono" />
        </div>
        <div>
          <label class="flex items-center gap-1.5 text-xs font-semibold uppercase tracking-wider mb-1.5" style="color: var(--text-muted);">
            <i data-lucide="calendar-plus" class="w-3.5 h-3.5 text-sky-400"></i>
            <span>Tanggal Awal</span>
          </label>
          <input type="date" id="startDate" required
            class="cyber-input w-full rounded-xl px-3.5 py-2.5 text-sm" />
        </div>
        <div>
          <label class="flex items-center gap-1.5 text-xs font-semibold uppercase tracking-wider mb-1.5" style="color: var(--text-muted);">
            <i data-lucide="calendar-check" class="w-3.5 h-3.5 text-sky-400"></i>
            <span>Tanggal Akhir</span>
          </label>
          <input type="date" id="endDate" required
            class="cyber-input w-full rounded-xl px-3.5 py-2.5 text-sm" />
        </div>
        <div>
          <button type="submit" id="submitBtn"
            class="w-full py-2.5 px-4 rounded-xl font-semibold text-sm text-slate-950 bg-sky-400 hover:bg-sky-300 active:scale-[0.99] transition cursor-pointer shadow-lg shadow-sky-500/20 flex items-center justify-center gap-1.5">
            <i data-lucide="search" class="w-4 h-4"></i>
            <span>Tampilkan Roster</span>
          </button>
        </div>
      </div>
    </form>

    <!-- Alert / Error Box -->
    <div id="alertBox" class="hidden rounded-xl p-4 text-sm border border-red-500/40 bg-red-500/10 text-red-400"></div>

    <!-- Toast Sukses Update -->
    <div id="toastBox" class="hidden rounded-xl p-4 text-sm border border-emerald-500/40 bg-emerald-500/15 text-emerald-400 flex items-center gap-2">
      <i data-lucide="check-circle-2" class="w-4 h-4 shrink-0"></i>
      <span id="toastMsg"></span>
    </div>

    <!-- Loading Indicator -->
    <div id="loader" class="hidden glass-panel rounded-2xl p-8 text-center">
      <div class="inline-block w-7 h-7 border-2 border-sky-400 border-t-transparent rounded-full animate-spin mb-2"></div>
      <p class="text-sm" style="color: var(--text-muted);">Memuat data TEAMS &amp; ROSTER...</p>
    </div>

    <!-- Hasil Profil & Matrix -->
    <div id="resultSection" class="hidden space-y-6">

      <!-- Card Profil dari Sheet TEAMS -->
      <div class="glass-panel rounded-2xl p-5">
        <div class="flex items-center gap-2 text-xs font-bold uppercase tracking-widest text-sky-400 mb-3.5">
          <i data-lucide="users" class="w-4 h-4"></i>
          <span>Data Personel (TEAMS)</span>
        </div>

        <div class="space-y-3">
          <!-- Baris 1: NIK sejajar dengan Nama (Nama lebih lebar) -->
          <div class="grid grid-cols-1 sm:grid-cols-12 gap-3">
            <div class="p-3.5 rounded-xl border sm:col-span-4 flex items-center gap-3" style="border-color: var(--border-color); background: var(--bg-input);">
              <div class="w-9 h-9 rounded-lg bg-sky-500/15 border border-sky-400/30 flex items-center justify-center shrink-0 text-sky-400">
                <i data-lucide="fingerprint" class="w-4 h-4"></i>
              </div>
              <div class="min-w-0">
                <div class="text-[11px] uppercase tracking-wider" style="color: var(--text-muted);">NIK</div>
                <div id="resNik" class="text-sm font-bold mono mt-0.5 truncate">-</div>
              </div>
            </div>

            <div class="p-3.5 rounded-xl border sm:col-span-8 flex items-center gap-3" style="border-color: var(--border-color); background: var(--bg-input);">
              <div class="w-9 h-9 rounded-lg bg-indigo-500/15 border border-indigo-400/30 flex items-center justify-center shrink-0 text-indigo-400">
                <i data-lucide="user-check" class="w-4 h-4"></i>
              </div>
              <div class="min-w-0">
                <div class="text-[11px] uppercase tracking-wider" style="color: var(--text-muted);">Nama</div>
                <div id="resNama" class="text-sm font-bold mt-0.5 truncate">-</div>
              </div>
            </div>
          </div>

          <!-- Baris 2: Jabatan (lebih lebar) sejajar dengan Store -->
          <div class="grid grid-cols-1 sm:grid-cols-12 gap-3">
            <div class="p-3.5 rounded-xl border sm:col-span-8 flex items-center gap-3" style="border-color: var(--border-color); background: var(--bg-input);">
              <div class="w-9 h-9 rounded-lg bg-purple-500/15 border border-purple-400/30 flex items-center justify-center shrink-0 text-purple-400">
                <i data-lucide="briefcase" class="w-4 h-4"></i>
              </div>
              <div class="min-w-0">
                <div class="text-[11px] uppercase tracking-wider" style="color: var(--text-muted);">Jabatan</div>
                <div id="resJabatan" class="text-sm font-semibold mt-0.5 truncate">-</div>
              </div>
            </div>

            <div class="p-3.5 rounded-xl border sm:col-span-4 flex items-center gap-3" style="border-color: var(--border-color); background: var(--bg-input);">
              <div class="w-9 h-9 rounded-lg bg-cyan-500/15 border border-cyan-400/30 flex items-center justify-center shrink-0 text-cyan-400">
                <i data-lucide="store" class="w-4 h-4"></i>
              </div>
              <div class="min-w-0">
                <div class="text-[11px] uppercase tracking-wider" style="color: var(--text-muted);">Store</div>
                <div id="resStore" class="text-sm font-bold text-sky-400 mt-0.5 truncate">-</div>
              </div>
            </div>
          </div>

          <!-- Baris 3: WA Person di bawahnya -->
          <div class="p-3.5 rounded-xl border flex items-center gap-3" style="border-color: var(--border-color); background: var(--bg-input);">
            <div class="w-9 h-9 rounded-lg bg-emerald-500/15 border border-emerald-400/30 flex items-center justify-center shrink-0 text-emerald-400">
              <i data-lucide="message-circle" class="w-4 h-4"></i>
            </div>
            <div class="min-w-0">
              <div class="text-[11px] uppercase tracking-wider" style="color: var(--text-muted);">WA Person</div>
              <div id="resWa" class="text-sm font-semibold mono mt-0.5 truncate">-</div>
            </div>
          </div>
        </div>
      </div>

      <!-- Matrix Jadwal dari Sheet ROSTER -->
      <div class="glass-panel rounded-2xl p-5">
        <div class="flex flex-wrap items-center justify-between gap-2 mb-4">
          <div class="flex items-center gap-2 text-xs font-bold uppercase tracking-widest text-sky-400">
            <i data-lucide="layout-grid" class="w-4 h-4"></i>
            <span>Matrix Jadwal Harian (ROSTER)</span>
          </div>
          <div class="flex items-center gap-2">
            <span class="text-[11px]" style="color: var(--text-muted);">Klik kartu untuk Shift Change</span>
            <div id="matrixCount" class="text-xs px-2.5 py-1 rounded-full bg-sky-500/15 text-sky-400 font-semibold">0 Hari</div>
          </div>
        </div>

        <div id="matrixGrid" class="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-5 lg:grid-cols-7 gap-3"></div>
      </div>

    </div>
  </div>

  <!-- MODAL POPUP: SHIFT CHANGE -->
  <div id="shiftModal" class="fixed inset-0 z-50 hidden items-center justify-center p-4 bg-black/70 backdrop-blur-sm">
    <div class="modal-panel w-full max-w-md rounded-2xl p-6 relative">
      <div class="flex items-center justify-between pb-3.5 border-b" style="border-color: var(--border-color);">
        <div class="flex items-center gap-2">
          <div class="w-8 h-8 rounded-lg bg-sky-500/15 border border-sky-400/30 flex items-center justify-center text-sky-400">
            <i data-lucide="repeat" class="w-4 h-4"></i>
          </div>
          <div>
            <h2 class="text-base font-bold tracking-wide">SHIFT CHANGE</h2>
            <p id="modalDateInfo" class="text-xs" style="color: var(--text-muted);">-</p>
          </div>
        </div>
        <button type="button" onclick="closeShiftModal()" title="Tutup tanpa perubahan"
          class="w-8 h-8 rounded-lg border flex items-center justify-center text-sm font-bold hover:bg-red-500/15 hover:text-red-400 hover:border-red-500/40 transition cursor-pointer"
          style="border-color: var(--border-color); color: var(--text-muted);">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>

      <form id="shiftChangeForm" onsubmit="submitShiftChange(event)" class="mt-4 space-y-4">
        <div id="modalError" class="hidden rounded-xl p-3 text-xs border border-red-500/40 bg-red-500/10 text-red-400"></div>

        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider mb-1.5" style="color: var(--text-muted);">
            Before :
          </label>
          <div id="modalBefore"
            class="w-full rounded-xl px-4 py-3 text-base font-extrabold mono border"
            style="border-color: var(--border-color); background: var(--bg-input);">
            -
          </div>
        </div>

        <div>
          <label for="modalAfterInput" class="block text-xs font-semibold uppercase tracking-wider mb-1.5" style="color: var(--text-muted);">
            After :
          </label>
          <input type="text" id="modalAfterInput" placeholder="Contoh: SP16" required autocomplete="off"
            class="cyber-input w-full rounded-xl px-4 py-3 text-base font-extrabold mono uppercase" />
        </div>

        <div class="pt-2">
          <button type="submit" id="modalProcessBtn"
            class="w-full py-3 px-4 rounded-xl font-bold text-sm text-slate-950 bg-sky-400 hover:bg-sky-300 active:scale-[0.99] transition cursor-pointer shadow-lg shadow-sky-500/20 flex items-center justify-center gap-2">
            <i data-lucide="check" class="w-4 h-4"></i>
            <span>Proses</span>
          </button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // GANTI URL DI BAWAH INI DENGAN URL WEB APP GOOGLE APPS SCRIPT ANDA
    const GAS_API_URL = 'https://script.google.com/macros/s/AKfycbzRPz71SQpxzqXIQNAUj5J6ejHe5hw3zADuU4nw7k16DtKdUcupTZWlaeVSOUOefUs0mg/exec';

    let autoSearchTimer = null;
    let lastQueryKey = '';
    let currentData = null;
    let selectedMatrixItem = null;

    window.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();

      const today = new Date();
      const nextWeek = new Date();
      nextWeek.setDate(today.getDate() + 6);

      const startEl = document.getElementById('startDate');
      const endEl = document.getElementById('endDate');
      const nikEl = document.getElementById('nikInput');

      startEl.value = today.toISOString().split('T')[0];
      endEl.value = nextWeek.toISOString().split('T')[0];
      nikEl.focus();

      nikEl.addEventListener('input', () => scheduleAutoSearch(350));
      nikEl.addEventListener('change', () => scheduleAutoSearch(50));
      nikEl.addEventListener('paste', () => scheduleAutoSearch(100));

      startEl.addEventListener('change', () => scheduleAutoSearch(100));
      endEl.addEventListener('change', () => scheduleAutoSearch(100));

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closeShiftModal();
      });
    });

    async function callGasApi(payloadObj) {
      if (!GAS_API_URL || GAS_API_URL.includes('MASUKKAN_DEPLOYMENT_ID_ANDA')) {
        throw new Error('GAS_API_URL belum diisi dengan URL Web App Google Apps Script.');
      }

      const response = await fetch(GAS_API_URL, {
        method: 'POST',
        redirect: 'follow',
        body: JSON.stringify(payloadObj)
      });

      if (!response.ok) {
        throw new Error('HTTP status ' + response.status);
      }

      return await response.json();
    }

    function scheduleAutoSearch(delayMs = 350) {
      clearTimeout(autoSearchTimer);
      const nik = document.getElementById('nikInput').value.trim();

      if (!nik) {
        lastQueryKey = '';
        currentData = null;
        document.getElementById('resultSection').classList.add('hidden');
        document.getElementById('alertBox').classList.add('hidden');
        return;
      }

      autoSearchTimer = setTimeout(() => {
        runSearch(false);
      }, delayMs);
    }

    function toggleTheme() {
      const html = document.documentElement;
      const btn = document.getElementById('themeBtn');
      const isDark = html.getAttribute('data-theme') === 'dark';
      const nextTheme = isDark ? 'light' : 'dark';
      html.setAttribute('data-theme', nextTheme);

      if (nextTheme === 'light') {
        btn.innerHTML = `<i data-lucide="moon" class="w-3.5 h-3.5 text-slate-700"></i><span>Dark Mode</span>`;
      } else {
        btn.innerHTML = `<i data-lucide="sun" class="w-3.5 h-3.5 text-amber-400"></i><span>Light Mode</span>`;
      }
      lucide.createIcons();
    }

    function handleSearch(e) {
      e.preventDefault();
      clearTimeout(autoSearchTimer);
      runSearch(true);
    }

    async function runSearch(forceRefresh = false) {
      const nik = document.getElementById('nikInput').value.trim();
      const start = document.getElementById('startDate').value;
      const end = document.getElementById('endDate').value;

      const alertBox = document.getElementById('alertBox');
      const loader = document.getElementById('loader');
      const resultSection = document.getElementById('resultSection');
      const btn = document.getElementById('submitBtn');

      if (!nik || !start || !end) return;

      const queryKey = `${nik}|${start}|${end}`;
      if (!forceRefresh && queryKey === lastQueryKey) return;

      alertBox.classList.add('hidden');

      if (start > end) {
        alertBox.textContent = 'Tanggal Awal tidak boleh lebih besar dari Tanggal Akhir.';
        alertBox.classList.remove('hidden');
        resultSection.classList.add('hidden');
        return;
      }

      lastQueryKey = queryKey;
      loader.classList.remove('hidden');
      btn.disabled = true;

      try {
        const res = await callGasApi({
          action: 'getSchedule',
          nik: nik,
          startDate: start,
          endDate: end
        });

        loader.classList.add('hidden');
        btn.disabled = false;

        if (!res || res.status === 'error') {
          currentData = null;
          resultSection.classList.add('hidden');
          alertBox.textContent = res ? res.message : 'Gagal mengambil data.';
          alertBox.classList.remove('hidden');
          return;
        }

        currentData = res;
        renderResult(res);
      } catch (err) {
        loader.classList.add('hidden');
        btn.disabled = false;
        currentData = null;
        resultSection.classList.add('hidden');
        alertBox.textContent = 'Error koneksi API: ' + err.message;
        alertBox.classList.remove('hidden');
      }
    }

    function getShiftClass(shift) {
      const s = shift.toUpperCase();
      if (s === 'DO' || s === 'OFF') return 'shift-do';
      if (s === 'AL' || s === 'CUTI' || s === 'PH') return 'shift-al';
      if (s.startsWith('ST09') || s.startsWith('ST08')) return 'shift-st09';
      if (s.startsWith('ST14') || s.startsWith('ST13')) return 'shift-st14';
      if (s.startsWith('SP')) return 'shift-sp';
      return 'shift-default';
    }

    function renderResult(data) {
      if (data.periode) {
        document.getElementById('periodeSubtitle').innerHTML = `
          <i data-lucide="calendar-range" class="w-4 h-4 text-sky-400"></i>
          <span>${data.periode}</span>
        `;
      }

      document.getElementById('resNik').textContent = data.profile.nik;
      document.getElementById('resNama').textContent = data.profile.nama;
      document.getElementById('resJabatan').textContent = data.profile.jabatan;
      document.getElementById('resStore').textContent = data.profile.store;
      document.getElementById('resWa').textContent = data.profile.wa;

      const grid = document.getElementById('matrixGrid');
      const countBadge = document.getElementById('matrixCount');
      grid.innerHTML = '';

      if (data.warning) {
        const alertBox = document.getElementById('alertBox');
        alertBox.textContent = data.warning;
        alertBox.classList.remove('hidden');
      }

      countBadge.textContent = data.matrix.length + ' Hari';

      if (data.matrix.length === 0) {
        grid.innerHTML = '<div class="col-span-full text-center py-6 text-sm" style="color: var(--text-muted);">Tidak ada jadwal roster pada rentang tanggal yang dipilih.</div>';
      } else {
        data.matrix.forEach((item, idx) => {
          const badgeClass = getShiftClass(item.shift);
          const card = document.createElement('button');
          card.type = 'button';
          card.onclick = () => openShiftModal(idx);
          card.className = `rounded-xl border p-3.5 flex flex-col items-center justify-center text-center transition hover:scale-[1.04] active:scale-[0.98] cursor-pointer relative group ${badgeClass}`;
          card.innerHTML = `
            <span class="text-[11px] opacity-80 font-medium">${item.dayName}</span>
            <span class="text-xs font-bold uppercase tracking-wide mt-0.5">${item.dateLabel}</span>
            <span class="text-lg font-extrabold mono mt-2 tracking-wider">${item.shift}</span>
            <span class="text-[10px] opacity-0 group-hover:opacity-80 transition mt-1 flex items-center gap-1">
              <i data-lucide="edit-3" class="w-2.5 h-2.5"></i> Ubah
            </span>
          `;
          grid.appendChild(card);
        });
      }

      document.getElementById('resultSection').classList.remove('hidden');
      lucide.createIcons();
    }

    function openShiftModal(matrixIndex) {
      if (!currentData || !currentData.matrix || !currentData.matrix[matrixIndex]) return;

      selectedMatrixItem = {
        index: matrixIndex,
        ...currentData.matrix[matrixIndex]
      };

      document.getElementById('modalDateInfo').textContent =
        `${selectedMatrixItem.dayName}, ${selectedMatrixItem.dateLabel} • ${currentData.profile.nama}`;
      document.getElementById('modalBefore').textContent = selectedMatrixItem.shift;

      const afterInput = document.getElementById('modalAfterInput');
      afterInput.value = '';
      document.getElementById('modalError').classList.add('hidden');

      const modal = document.getElementById('shiftModal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
      lucide.createIcons();

      setTimeout(() => afterInput.focus(), 50);
    }

    function closeShiftModal() {
      const modal = document.getElementById('shiftModal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
      selectedMatrixItem = null;
    }

    async function submitShiftChange(e) {
      e.preventDefault();
      if (!currentData || !selectedMatrixItem) return;

      const afterVal = document.getElementById('modalAfterInput').value.trim().toUpperCase();
      const modalError = document.getElementById('modalError');
      const processBtn = document.getElementById('modalProcessBtn');

      modalError.classList.add('hidden');

      if (!afterVal) {
        modalError.textContent = 'Silakan isi jadwal After terlebih dahulu.';
        modalError.classList.remove('hidden');
        return;
      }

      processBtn.disabled = true;
      processBtn.innerHTML = `<span class="inline-block w-4 h-4 border-2 border-slate-950 border-t-transparent rounded-full animate-spin"></span><span>Memproses...</span>`;

      try {
        const res = await callGasApi({
          action: 'updateShift',
          nik: currentData.profile.nik,
          nama: currentData.profile.nama,
          store: currentData.profile.store,
          jabatan: currentData.profile.jabatan,
          colIndex: selectedMatrixItem.colIndex,
          dateLabel: selectedMatrixItem.dateLabel,
          before: selectedMatrixItem.shift,
          after: afterVal
        });

        processBtn.disabled = false;
        processBtn.innerHTML = `<i data-lucide="check" class="w-4 h-4"></i><span>Proses</span>`;
        lucide.createIcons();

        if (!res || res.status === 'error') {
          modalError.textContent = res ? res.message : 'Gagal memperbarui roster.';
          modalError.classList.remove('hidden');
          return;
        }

        currentData.matrix[selectedMatrixItem.index].shift = res.newShift;
        renderResult(currentData);
        closeShiftModal();
        showToast(res.message);
      } catch (err) {
        processBtn.disabled = false;
        processBtn.innerHTML = `<i data-lucide="check" class="w-4 h-4"></i><span>Proses</span>`;
        lucide.createIcons();
        modalError.textContent = 'Error server: ' + err.message;
        modalError.classList.remove('hidden');
      }
    }

    function showToast(msg) {
      const toastBox = document.getElementById('toastBox');
      document.getElementById('toastMsg').textContent = msg;
      toastBox.classList.remove('hidden');
      lucide.createIcons();

      setTimeout(() => {
        toastBox.classList.add('hidden');
      }, 4500);
    }
  </script>
</body>
</html>
