<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Area Fajar - Daily Job Web & ALL VM</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    :root {
      --bg-dark: #07090e;
      --bg-header: rgba(11, 15, 25, 0.85);
      --bg-surface: rgba(15, 23, 42, 0.75);
      --border-color: rgba(255, 255, 255, 0.08);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-cyan: #06b6d4;
      --sidebar-width: 270px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-main); min-height: 100vh; padding-bottom: 60px; overflow-x: hidden; }

    #loginModal {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(5, 7, 12, 0.9); backdrop-filter: blur(8px);
      z-index: 3000; display: flex; justify-content: center; align-items: center; padding: 20px;
    }
    .login-card {
      background: #0f172a; border: 1px solid rgba(6, 182, 212, 0.3);
      padding: 30px; border-radius: 16px; width: 100%; max-width: 400px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6); text-align: center;
    }
    .login-card h3 { font-family: 'Space Grotesk', sans-serif; color: #06b6d4; margin-bottom: 6px; font-size: 1.4rem; }
    .form-control {
      width: 100%; padding: 12px 14px; background: #07090e; border: 1px solid var(--border-color);
      color: #fff; border-radius: 8px; font-size: 14px; margin-bottom: 14px; outline: none;
    }
    .form-control:focus { border-color: #06b6d4; }
    .btn-custom {
      width: 100%; padding: 12px; background: linear-gradient(135deg, #06b6d4, #3b82f6);
      color: #fff; font-weight: 700; border: none; border-radius: 8px; cursor: pointer; font-size: 14px;
    }

    #sidebarOverlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.65); z-index: 1040; display: none; }
    #sidebarOverlay.active { display: block; }
    .sidebar {
      position: fixed; top: 0; left: calc(-1 * var(--sidebar-width)); width: var(--sidebar-width); height: 100%;
      background: #090d16; border-right: 1px solid var(--border-color); display: flex; flex-direction: column; padding: 20px 14px; gap: 15px;
      z-index: 1050; transition: left 0.3s ease;
    }
    .sidebar.active { left: 0; }
    .sidebar-header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 12px; border-bottom: 1px solid var(--border-color); }
    .sidebar-brand { display: flex; align-items: center; gap: 10px; font-size: 1.1rem; font-weight: 700; color: var(--accent-cyan); }
    .sidebar-close-btn { background: transparent; border: none; color: #94a3b8; font-size: 22px; cursor: pointer; }
    .nav-menu { display: flex; flex-direction: column; gap: 6px; flex-grow: 1; overflow-y: auto; }
    .sidebar-item { padding: 10px 12px; color: #e2e8f0; border-radius: 8px; display: flex; align-items: center; gap: 12px; text-decoration: none; font-weight: 600; font-size: 13px; cursor: pointer; }
    .sidebar-item:hover, .sidebar-item.active { background: rgba(6, 182, 212, 0.15); color: var(--accent-cyan); }

    header { background: var(--bg-header); border-bottom: 1px solid var(--border-color); position: sticky; top: 0; z-index: 100; }
    .nav-container { max-width: 1280px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; height: 76px; gap: 12px; }
    .brand { font-family: 'Space Grotesk', sans-serif; font-size: 1.2rem; font-weight: 700; background: linear-gradient(135deg, #06b6d4, #3b82f6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; display: flex; align-items: center; gap: 10px; }
    .sidebar-trigger-btn { background: var(--bg-surface); border: 1px solid var(--border-color); color: var(--accent-cyan); padding: 8px 12px; border-radius: 8px; cursor: pointer; }
    .nav-tabs { display: flex; gap: 8px; overflow-x: auto; padding: 6px 0; scrollbar-width: none; }
    .nav-tab { padding: 8px 16px; border-radius: 10px; border: 1px solid var(--border-color); background: var(--bg-surface); color: var(--text-muted); font-weight: 600; font-size: 0.85rem; cursor: pointer; white-space: nowrap; }
    .nav-tab.active { background: rgba(6, 182, 212, 0.25); color: var(--text-main); border-color: rgba(56, 189, 248, 0.6); }

    main { max-width: 1280px; margin: 24px auto; padding: 0 16px; }
    .section-header { margin-bottom: 24px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border-color); padding-bottom: 12px; flex-wrap: wrap; gap: 10px; }
    .section-title { font-family: 'Space Grotesk', sans-serif; font-size: 1.35rem; font-weight: 700; display: flex; align-items: center; gap: 10px; }
    
    .header-info-group { display: flex; align-items: center; gap: 12px; }
    .badge-count { font-size: 0.78rem; background: rgba(56, 189, 248, 0.15); color: #06b6d4; padding: 4px 12px; border-radius: 20px; font-weight: 600; }
    .last-update-text { font-size: 0.78rem; color: var(--text-muted); font-weight: 500; display: flex; align-items: center; gap: 5px; }

    .matrix-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
    .card { border-radius: 16px; padding: 20px; border: 1px solid var(--border-color); background: var(--bg-surface); display: flex; flex-direction: column; gap: 12px; position: relative; }
    .card::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 3.5px; background: var(--card-accent, #06b6d4); }
    .card-header-item { display: flex; align-items: center; gap: 12px; padding-bottom: 10px; border-bottom: 1px solid var(--border-color); }
    .card-title-text { font-family: 'Space Grotesk', sans-serif; font-size: 1.1rem; font-weight: 700; }
    .card-item { display: flex; flex-direction: column; gap: 4px; }
    .card-label { font-size: 0.7rem; text-transform: uppercase; font-weight: 700; color: var(--text-muted); display: flex; align-items: center; gap: 6px; }
    .card-value { font-size: 0.9rem; font-weight: 500; word-break: break-word; }

    .btn-link-masked {
      display: inline-flex; align-items: center; justify-content: center; gap: 10px; padding: 10px 18px;
      background: rgba(15, 23, 42, 0.6); color: var(--text-main); text-decoration: none; border-radius: 10px;
      font-weight: 700; font-size: 0.9rem; border: 1px solid var(--border-color); transition: all 0.2s ease; margin-top: 6px; width: fit-content;
    }
    .btn-link-masked:hover { background: rgba(6, 182, 212, 0.15); border-color: var(--accent-cyan); color: var(--accent-cyan); }
    .btn-action { padding: 8px; border-radius: 8px; font-weight: 700; font-size: 0.8rem; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 6px; border: none; cursor: pointer; }

    .loader-container { text-align: center; padding: 60px 0; color: var(--text-muted); }
    .spinner { width: 44px; height: 44px; border: 3px solid rgba(56, 189, 248, 0.1); border-top: 3px solid #06b6d4; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px auto; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
